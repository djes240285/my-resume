mindset:
  title: Как я работаю
  badge: ПОДХОД
  steps:
    - phase: 01 ·
      title: Погружение, аудит и диалог
      detail: Вхожу в проект через изучение кода и архитектуры. Даю честный фидбек, соотношу его с вашими ожиданиями и фиксирую цели. Для меня важно сначала выслушать бизнес и заслужить доверие, а не навязывать шаблоны.
      indicatorLabel: АУДИТ·DIFF
      indicator: audit
    - phase: 02 ·
      title: Адаптивность под ваш регламент
      detail: Если процессов нет — помогу их выстроить и обучить команду. Если у вас уже действует жёсткий регламент, правила версионирования и работы с фичами — бесшовно встроюсь в ваш контур и буду строго следовать вашим стандартам.
      indicatorLabel: GIT·FLOW
      indicator: regime
    - phase: 03 ·
      title: От простого к сложному
      detail: Двигаюсь концептуально ориентированно, не перегружая архитектуру. Сначала стабилизируем базовые узлы и выпускаем главные фичи, а затем плавно развиваем систему. Нахожу наилучший сценарий разработки под конкретный бюджет и масштаб.
      indicatorLabel: ITER·SCALE
      indicator: scale
    - phase: 04 ·
      title: Сквозная ответственность за продукт
      detail: Отвечаю за систему целиком — от чистоты бэкенда до логики интерфейса. Гарантирую Pixel-Perfect соответствие Figma и продумываю поведение UI в краевых состояниях, чтобы бизнес получал готовый, автономный актив.
      indicatorLabel: BE·FE·UI
      indicator: e2e
