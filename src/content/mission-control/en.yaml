mindset:
  title: How I work
  badge: APPROACH
  steps:
    - phase: 01 ·
      title: Immersion, audit, and dialogue
      detail: I start by reading the code and architecture. I give honest feedback, align it with your expectations, and agree on goals. Listening to the business and earning trust comes first — not pushing a template playbook.
      indicatorLabel: AUDIT·DIFF
      indicator: audit
    - phase: 02 ·
      title: Fit your operating rules
      detail: If you have no process yet, I help shape one and coach the team. If you already run strict versioning, feature flow, and release rules — I plug into your contour and follow your standards without friction.
      indicatorLabel: GIT·FLOW
      indicator: regime
    - phase: 03 ·
      title: Simple first, then depth
      detail: I stay concept-driven and avoid over-engineering early. We stabilize core nodes and ship the main features first, then grow the system step by step. I pick the best delivery path for your budget and scale.
      indicatorLabel: ITER·SCALE
      indicator: scale
    - phase: 04 ·
      title: End-to-end product ownership
      detail: I own the system as a whole — from clean backend to interface logic. Pixel-perfect Figma match and thoughtful edge-case UI so the business gets a ready, self-sufficient asset.
      indicatorLabel: BE·FE·UI
      indicator: e2e
